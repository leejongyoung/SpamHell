<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>SPAM MAKER</title>
        <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
        <link rel="manifest" href="assets/favicon/site.webmanifest">
        <link rel="mask-icon" href="assets/favicon/safari-pinned-tab.svg" color="#00cc00">
        <meta name="msapplication-TileColor" content="#000000">
        <meta name="theme-color" content="#000000">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
    </head>

    <body class="container">
        <form>
            <h1 style="padding: 20px 0px;">💌 SPAM MAKER</h1>
            <div class="form-group">
              <label for="text-source">INPUT</label>
              <textarea class="form-control" id="text-source" rows="7" maxlength="300" aria-describedby="text" placeholder="Please Typing Text"></textarea>
              <small id="text" class="form-text text-muted">Support Korean and English</small>
            </div>
            <br>
            <div class="form-group">
              <label for="text-transformed">RESULT</label>
              <textarea class="form-control" id="text-transformed" rows="7" maxlength="300" aria-describedby="text"></textarea>
            </div>
            <br>
            <button type="button" class="btn btn-primary btn-transform" data-mode="spam">SPAM TEXT</button>
            <button type="button" class="btn btn-primary btn-transform" data-mode="korean">KOREAN TEXT</button>
            <button type="button" class="btn btn-primary" id="btn-reset">REWRITE</button>
        </form>

        <script type="text/javascript" src="kotlin.js"></script>
        <script type="text/javascript" src="spammaker.js"></script>
        <script type="text/javascript" src="clipboard.js"></script>
    </body>
</html>
