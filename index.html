<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SpamHell - 사이버 보안 워크벤치</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <meta name="theme-color" content="#0a0b0d">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid slim-blog-layout">
        <!-- Ultra Slim Header -->
        <header class="dashboard-header mb-2">
            <div class="header-brand">
                <h1 class="brand-logo">SpamHell</h1>
                <span class="status-text">SYSTEM ACTIVE</span>
            </div>
            <a href="https://github.com/leejongyoung" target="_blank" class="github-link">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
        </header>

        <main class="main-content">
            <!-- 1. 메시지 입력하기 -->
            <div class="cyber-card mb-2">
                <div class="section-label">
                    <span class="label-icon"></span>
                    <span class="label-text">메시지 입력하기</span>
                </div>
                
                <div class="d-flex align-items-center gap-3 mb-2">
                    <div class="sub-label">퀵 템플릿:</div>
                    <div class="template-list">
                        <button class="template-chip template-btn" data-template="typeA">🎁 당첨</button>
                        <button class="template-chip template-btn" data-template="typeB">🤖 AI</button>
                        <button class="template-chip template-btn" data-template="typeC">💀 공포</button>
                    </div>
                </div>

                <textarea class="cyber-input mb-2" id="text-source" rows="3" placeholder="메시지 입력..."></textarea>

                <div class="action-grid-triple">
                    <button class="cyber-btn btn-primary-glow btn-transform" data-mode="spam">스팸체 변환</button>
                    <button class="cyber-btn btn-outline btn-transform" data-mode="korean">한국인 최적화</button>
                    <button class="cyber-btn btn-outline" id="btn-reset">초기화</button>
                </div>
            </div>

            <!-- 2. 메시지 출력 결과 -->
            <div class="cyber-card mb-2">
                <div class="section-label">
                    <span class="label-icon accent"></span>
                    <span class="label-text">메시지 출력 결과</span>
                </div>
                <textarea class="cyber-input result-box mb-2" id="text-transformed" rows="3" readonly placeholder="변환 대기 중..."></textarea>
                <button class="cyber-btn btn-accent-glow w-100" id="btn-copy" data-clipboard-target="#text-transformed">데이터 복사</button>
            </div>

            <!-- 3. 이미지 출력 결과 -->
            <div class="cyber-card">
                <div class="section-label">
                    <span class="label-icon accent"></span>
                    <span class="label-text">이미지 출력 결과</span>
                </div>
                <div id="combined-card-area" class="mms-card-frame mb-2">
                    <div class="mms-photo">
                        <img src="assets/images/police.png" alt="POLICE">
                    </div>
                    <div class="mms-content" id="preview-text-target">변환된 메시지 미리보기</div>
                </div>
                <button class="cyber-btn btn-primary-glow w-100" id="btn-save-image">이미지 저장</button>
            </div>
        </main>

        <footer class="dashboard-footer mt-2">
            <p class="footer-text">&copy; 2026 SPAMHELL. 보이스피싱 근절을 응원합니다.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/spammaker.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
