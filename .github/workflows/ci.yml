name: CI and Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: LICENSE/NOTICE copies match the root files
        run: |
          for dir in packages/*; do
            diff -q LICENSE "$dir/LICENSE"
            diff -q NOTICE "$dir/NOTICE"
          done

      - name: Web logo and icon match the asset masters
        run: |
          diff -q assets/logo.svg apps/web/public/logo.svg
          diff -q assets/icon.svg apps/web/public/favicon/favicon.svg

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: npm pack (dry run)
        run: |
          npm pack --dry-run -w spamhell
          npm pack --dry-run -w spamhell-cli
          npm pack --dry-run -w spamhell-mcp

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Test (includes cross-language golden vectors)
        run: uv run --python ${{ matrix.python }} --with pytest python -m pytest -q

      - name: Build and check distributions
        if: matrix.python == '3.13'
        run: |
          uv build
          uvx twine check dist/*

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, python]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
